name: 问题报告
description: 崩溃、功能异常、中文界面下的排版或显示问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        上游版本里本来就有的功能问题，请报到[上游仓库](https://github.com/robbietilton/Compositor/issues)，那边才有人能修。
        只是翻译不对的话，请改用「翻译问题」模板。
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 下载页或 App 里显示的版本，例如 1.5.12-cn.1
      placeholder: 1.5.12-cn.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统与机型
      placeholder: macOS 26.0，MacBook Pro M2 Pro
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: 界面语言
      options:
        - 简体中文
        - English
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 从哪来的
      description: 从 Releases 下载的安装包，还是自己用 Xcode 编译的
      placeholder: Releases 下载的 DMG
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 新建 1920×1080 画布
        2. 添加一个调整层，选曲线
        3. 拖动第二个控制点
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的结果与实际的结果
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 截图、日志或样例文件
      description: 能复现问题的 .comp 工程或图片可以直接拖进来
    validations:
      required: false
